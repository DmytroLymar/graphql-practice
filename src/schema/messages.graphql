scalar DateTime

input MessageInput {
    content: String
    author: String
}

type Message {
    id: ID!
    content: String
    author: String
    createdAt: DateTime!
}

extend type Query {
    getMessage(id: ID!): Message
    getMessages: [Message!]!
}

extend type Mutation {
    createMessage(input: MessageInput): Message
    updateMessage(id: ID!, input: MessageInput): Message
}
